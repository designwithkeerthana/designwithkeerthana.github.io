<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keerthana · Portfolio</title>
<meta name="description" content="Keerthana: interior designer moving into construction project management. Seattle, Washington.">
<meta property="og:title" content="Keerthana · Portfolio">
<meta property="og:description" content="Interior designer moving into construction project management.">
<meta property="og:image" content="assets/portrait.webp">
<link rel="icon" href="assets/portrait.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Inter+Tight:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: two full-width "spreads" drawn on a 1630-unit artboard that scales with the window — a hello spread with a naive self-portrait, then a staggered drafting-grid index — closing on a drawing title block. Single light look by design. */
:root{
  --paper:#FFFFF0; --ink:#111114; --grey:#5E5E66; --line:#A9A9AE; --ghost:#DFE3F0; --accent:#2F35A8; --tint:rgba(120,104,60,.08);
  --sans:"Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:var(--tex,none);background-size:640px 640px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px}
.bar a{text-decoration:none}
.bar nav{display:flex;gap:22px}
.bar nav a:hover{color:var(--accent)}

/* artboard units */
.board{container-type:inline-size;width:100%}
.art-u{--u:calc(100cqw / 1630)}

/* ---------- spread 1: hello (1454-unit artboard, matches the Figma frame) ---------- */
.hero-u{--u:calc(100cqw / 1454)}
.spread-in{display:grid;grid-template-columns:calc(var(--u)*526) minmax(0,1fr);column-gap:calc(var(--u)*20);padding:calc(var(--u)*58) calc(var(--u)*60) 0 calc(var(--u)*62);align-items:start}
.portrait{width:100%;max-width:100%}
.portrait img{width:100%;height:auto;display:block}
.hello{font-size:calc(var(--u)*128);line-height:.8;letter-spacing:-.052em;margin:calc(var(--u)*6) 0 0}
.hello b{display:block;font-weight:700}
.hello span{display:block;font-weight:400;letter-spacing:-.058em;margin-top:calc(var(--u)*6);white-space:nowrap}
.facts{margin-top:calc(var(--u)*60);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:calc(var(--u)*36);row-gap:calc(var(--u)*26)}
.fsec{display:grid;grid-template-columns:calc(var(--u)*112) minmax(0,1fr);column-gap:calc(var(--u)*14);align-items:start}
.fsec h2{margin:0;font-size:max(14px, calc(var(--u)*21));font-weight:700;letter-spacing:-.025em;line-height:1.15}
.fsec.certs{grid-column:2;grid-row:1 / span 2;grid-template-columns:auto minmax(0,1fr)}
.fsec.skills{grid-column:1 / -1}
.fi{margin:0 0 calc(var(--u)*13)}
.fi:last-child{margin-bottom:0}
.fi b{display:block;font-weight:400;font-size:max(12px, calc(var(--u)*16.5));line-height:1.3}
.fi small{display:block;color:var(--grey);font-size:max(10px, calc(var(--u)*12.5));margin-top:calc(var(--u)*4)}
.sk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:calc(var(--u)*18);row-gap:calc(var(--u)*9);font-size:max(12px, calc(var(--u)*17));line-height:1.3}
.sk span{display:flex;align-items:center;gap:calc(var(--u)*10);min-width:0}
.dots{display:inline-flex;gap:max(2px, calc(var(--u)*4));flex:none}
.dots i{width:max(6px, calc(var(--u)*8));height:max(6px, calc(var(--u)*8));border-radius:50%;background:var(--ink)}
.dots i.o{background:transparent;box-shadow:inset 0 0 0 1.3px var(--ink)}
.strip{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;margin-top:calc(var(--u)*34);padding:0 calc(var(--u)*10) calc(var(--u)*44);font-size:max(12px, calc(var(--u)*16));color:#3A3A40}
.strip span{user-select:all}

/* ---------- spread 2: index ---------- */
.canvas{position:relative;width:100%;height:calc(var(--u)*1400)}
.canvas > *{position:absolute}
.vl{width:1px;background:var(--line)}
.hl{height:1px;background:var(--line)}
.bk{background:#000}
.ghost{font-family:"Archivo",sans-serif;margin:0;font-weight:800;font-stretch:125%;font-size:calc(var(--u)*98);line-height:1;letter-spacing:.01em;color:var(--ghost);white-space:nowrap}
.num{font-weight:700;font-size:max(12px, calc(var(--u)*15));line-height:1}
.num.r{text-align:right}
.item{display:flex;text-decoration:none;color:var(--ink)}
.item > div{flex:1 1 50%;min-width:0;position:relative;overflow:hidden}
.item .img svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.item .img.narrow svg{left:36%;width:64%}
.item .txt{padding:calc(var(--u)*6) calc(var(--u)*18);font-size:max(11px, calc(var(--u)*13.2));line-height:1.48;transition:background .2s}
.item .txt h3{margin:0;font-size:inherit;font-weight:600;letter-spacing:.005em}
.item .txt p{margin:0;font-weight:300;color:#2A2A30}
.item .txt .pg{font-weight:300;color:#2A2A30}
.item .txt .go{position:absolute;left:calc(var(--u)*18);bottom:calc(var(--u)*14);font-family:var(--mono);font-size:max(10px, calc(var(--u)*11));color:var(--grey);opacity:0;transition:opacity .2s}
.item:hover .txt,.item:focus-visible .txt{background:var(--tint)}
.item:hover .txt .go,.item:focus-visible .txt .go{opacity:1}
.item:hover h3{color:var(--accent)}
.deco svg{width:100%;height:100%;display:block;overflow:visible}

/* phone list (replaces the artboard on narrow screens) */
.mlist{display:none}
@media (max-width:760px){
  .spread-in{grid-template-columns:1fr;padding:12px 16px 0;row-gap:24px}
  .portrait{max-width:340px}
  .hello{font-size:clamp(50px,15vw,84px)}
  .facts{grid-template-columns:1fr;margin-top:30px;row-gap:24px}
  .fsec{grid-template-columns:110px minmax(0,1fr);column-gap:12px}
  .fsec.certs{grid-column:auto;grid-row:auto}
  .fi{margin-bottom:12px}
  .sk{grid-template-columns:1fr;row-gap:8px}
  .strip{flex-direction:column;margin-top:28px;padding:0 0 28px;gap:6px;font-size:14px}
  .canvas{display:none}
  .mlist{display:block;padding:8px 16px 0}
  .mghost{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:125%;font-size:56px;color:var(--ghost);line-height:1;margin:0 0 18px}
  .mitem{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line);text-decoration:none;min-height:150px}
  .mitem .n{font-weight:700;padding:8px 0}
  .mitem .img{position:relative;border-left:1px solid var(--line)}
  .mitem .img svg{position:absolute;inset:0;width:100%;height:100%}
  .mitem .t{padding:6px 12px;font-size:13px;line-height:1.45;border-left:1px solid var(--line)}
  .mitem h3{margin:0;font-size:13px;font-weight:600}
  .mitem p{margin:0;font-weight:300}
  .mlist .last{border-top:1px solid var(--line)}
}

/* ---------- contact ---------- */
.contact{padding-block:clamp(56px,8vw,110px) 40px;max-width:1500px;margin:0 auto}
.contact h2{font-weight:800;font-size:clamp(40px,6vw,96px);letter-spacing:-.055em;line-height:.9;margin:0 0 26px}
.tblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.tblock div{border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:12px 14px 14px;min-width:0}
.tblock .k{display:block;color:var(--grey);text-transform:uppercase;font-size:10.5px;letter-spacing:.12em;margin-bottom:6px}
.tblock .v{font-size:16px;font-weight:500;overflow-wrap:anywhere;user-select:all}
.tblock .wide{grid-column:span 2}
.tblock .meta .v{font-family:var(--mono);font-size:13px;font-weight:400}
@media (max-width:700px){.tblock{grid-template-columns:repeat(2,minmax(0,1fr))}}
.foot{padding-block:22px 36px;color:var(--grey);max-width:1500px;margin:0 auto}

/* ---------- project page ---------- */
.ppage{max-width:1500px;margin:0 auto}
.back{display:inline-flex;gap:8px;text-decoration:none;color:var(--grey);margin-top:22px}
.back:hover{color:var(--accent)}
.p-head{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:end;padding-block:26px 32px;border-bottom:1px solid var(--line)}
.p-meta{color:var(--accent)}
.p-head h1{font-weight:800;font-size:clamp(44px,7vw,112px);letter-spacing:-.058em;line-height:.88;margin:12px 0 14px;text-wrap:balance}
.p-sub{margin:0;font-size:19px;font-weight:300;max-width:30em}
.p-cover{position:relative;border:1px solid var(--line);aspect-ratio:4/3;max-width:100%;overflow:hidden;margin:0}
.p-cover svg{position:absolute;inset:0;width:100%;height:100%}
.draft{display:flex;gap:10px;align-items:center;margin:22px 0 0;padding:12px 16px;background:var(--tint)}
.draft::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.snap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:28px 0 0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.snap div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;min-width:0}
.snap dt{color:var(--grey);text-transform:uppercase;font-size:10.5px;letter-spacing:.12em}
.snap dd{margin:4px 0 0;font-weight:300;color:var(--grey)}
.secs{margin-top:40px}
.sec{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding-block:22px;border-top:1px solid var(--line)}
.sec h2{margin:0;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;display:flex;gap:10px}
.sec h2 i{font-style:normal;color:var(--accent)}
.slot{border:1.5px dashed var(--line);padding:18px 20px;color:var(--grey);font-size:15px;font-weight:300;min-height:84px}
.slot.tall{min-height:220px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.frame{aspect-ratio:4/5;max-width:100%;border:1.5px dashed var(--line);display:flex;align-items:flex-end;padding:12px;color:var(--grey)}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:56px}
.pn a{padding:22px 0;text-decoration:none;display:grid;gap:4px}
.pn a:last-child{text-align:right;border-left:1px solid var(--line);padding-left:16px}
.pn a:hover b{color:var(--accent)}
.pn b{font-size:18px}
@media (max-width:820px){
  .p-head{grid-template-columns:1fr}
  .snap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec{grid-template-columns:1fr;gap:12px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar gut">
  <a class="mono" href="#about"><b id="bar-name">KEERTHANA</b> &nbsp;/&nbsp; Design &rarr; Construction</a>
  <nav class="mono"><a href="#work">Work</a><a href="#contact">Contact</a></nav>
</header>

<main id="home">
  <section class="board" id="about">
    <div class="hero-u spread-in">
      <div class="portrait"><img src="assets/portrait.webp" alt="Illustrated self-portrait in profile with long curly hair and sunglasses on top of the head"></div>
      <div>
        <h1 class="hello"><b>Hello!</b><span>I&rsquo;m <span id="hello-name" style="display:inline;margin:0">Keerthana</span></span></h1>
        <div class="facts" id="facts"></div>
      </div>
      <div class="strip" id="strip"></div>
    </div>
  </section>

  <section class="board" id="work" aria-label="Project index">
    <div class="art-u canvas" id="canvas"></div>
    <div class="mlist" id="mlist"></div>
  </section>

  <section class="gut contact" id="contact">
    <h2>Let&rsquo;s build something.</h2>
    <div class="tblock" id="tblock"></div>
  </section>
</main>

<main id="project" class="gut ppage" hidden></main>

<div class="gut foot mono">&copy; <span id="foot-year">2026</span> <span id="foot-name">Keerthana</span> &nbsp;&middot;&nbsp; Portfolio v1</div>

<script src="content.js"></script>
<script>
const CATS={C:"Design – Construction",D:"UI/UX – Graphic",P:"Painting – Sketches"};
const SITE=window.SITE;
const PROJECTS=SITE.projects;
const CONTACT=[["Name",SITE.name,""],["Email",SITE.email,""],["Phone",SITE.phone,""],["Location",SITE.city,""],
  ["LinkedIn",SITE.linkedin,"wide"],["Resume",SITE.resume||"PDF coming soon","wide"],
  ["Sheet","Portfolio v1","meta"],["Date",SITE.updated||"","meta"],["Scale","NTS","meta"],["Drawn by",SITE.name,"meta"]];

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const f=n=>n.toFixed(1);
function blob(cx,cy,r,wob,seed,pts=14){const R=rng(seed);const a=[];for(let i=0;i<pts;i++){const t=i/pts*Math.PI*2;const rr=r*(1+(R()-.5)*wob);a.push([cx+Math.cos(t)*rr,cy+Math.sin(t)*rr])}
  let d="M"+f((a[pts-1][0]+a[0][0])/2)+" "+f((a[pts-1][1]+a[0][1])/2);for(let i=0;i<pts;i++){const p=a[i],q=a[(i+1)%pts];d+=" Q"+f(p[0])+" "+f(p[1])+" "+f((p[0]+q[0])/2)+" "+f((p[1]+q[1])/2)}return d+"Z"}
function jline(pts,seed,amp=1.6){const R=rng(seed);return "M"+pts.map(p=>f(p[0]+(R()-.5)*amp)+" "+f(p[1]+(R()-.5)*amp)).join(" L")}

/* dense plan: recursive room split with doors, like a cropped drawing set */
function plan(seed,W=240,H=240,depth=5){
  const R=rng(seed);const rooms=[];
  (function split(x,y,w,h,d){if(d===0||(w<34&&h<34)||(d<3&&R()<.18)){rooms.push([x,y,w,h]);return}
    const vert=w>h?R()<.8:R()<.2;const t=.3+R()*.4;
    if(vert){const a=w*t;split(x,y,a,h,d-1);split(x+a,y,w-a,h,d-1)}else{const a=h*t;split(x,y,w,a,d-1);split(x,y+a,w,h-a,d-1)}})(-10,-10,W+20,H+20,depth);
  let s="";rooms.forEach(([x,y,w,h],i)=>{s+=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/><rect x="${f(x+2.2)}" y="${f(y+2.2)}" width="${f(Math.max(0,w-4.4))}" height="${f(Math.max(0,h-4.4))}"/>`;
    if(w>22&&h>22&&R()<.75){const dx=x+2.2,dy=y+h-2.2,r=Math.min(11,w*.3);s+=`<path d="M${f(dx+4)} ${f(dy)} v${f(-r)} a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(r)}" stroke-width=".35"/>`}
    const k=R();
    if(w>40&&h>40&&k<.35){const n=Math.floor(w/20),m=Math.floor(h/20);for(let a=0;a<n;a++)for(let b=0;b<m;b++)s+=`<circle cx="${f(x+12+a*(w-24)/Math.max(1,n-1))}" cy="${f(y+12+b*(h-24)/Math.max(1,m-1))}" r="3.2"/>`}
    else if(w>26&&h>26&&k<.6){s+=`<rect x="${f(x+7)}" y="${f(y+7)}" width="${f(w*.45)}" height="${f(h*.3)}"/>`}
    else if(k<.75){for(let z=8;z<w+h;z+=5)s+=`<path d="M${f(x+Math.max(2,z-h))} ${f(y+Math.min(h-2,z))} L${f(x+Math.min(w-2,z))} ${f(y+Math.max(2,z-w))}" stroke-width=".3"/>`}});
  return s}
const ART={
  cafe:()=>plan(3),
  restaurant:()=>plan(17,240,240,6),
  house:()=>plan(29,240,240,5)+`<path d="M60 40 h40 M60 46 h40 M60 52 h40 M60 58 h40 M60 64 h40 M60 70 h40" stroke-width=".4"/>`,
  gantt(){let s="";for(let x=0;x<=240;x+=12)s+=`<path d="M${x} 0 V240" stroke-width=".25"/>`;
    const R=rng(5);let x=4;for(let i=0;i<26;i++){const y=6+i*9;const w=12+R()*40;const crit=R()<.4;s+=`<rect x="${f(x)}" y="${y}" width="${f(w)}" height="5" ${crit?'fill="#111"':''}/>`;
      s+=`<path d="M${f(x+w)} ${y+2.5} h3 v9" stroke-width=".4"/>`;x=x+w*(.4+R()*.6);if(x>170)x=4+R()*40}
    return s},
  wire(){let s="";for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=8+c*80,y=-20+r*96+(c%2)*30;s+=`<rect x="${x}" y="${y}" width="62" height="118" rx="8"/><path d="M${x} ${y+14} h62"/><rect x="${x+8}" y="${y+22}" width="46" height="30"/><path d="M${x+8} ${y+22} l46 30 M${x+54} ${y+22} l-46 30"/><path d="M${x+8} ${y+62} h40 M${x+8} ${y+70} h30 M${x+8} ${y+78} h36" stroke-width=".4"/><rect x="${x+8}" y="${y+92}" width="46" height="11" rx="5.5" fill="#111"/>`}return s},
  graphic(){let s="";for(let i=0;i<=240;i+=20)s+=`<path d="M${i} 0 V240 M0 ${i} H240" stroke-width=".25"/>`;
    return s+`<circle cx="90" cy="100" r="62"/><circle cx="90" cy="100" r="40" stroke-width=".4"/><rect x="100" y="90" width="110" height="110"/><path d="M100 90 L210 200 M210 90 L100 200"/><path d="M20 230 L78 130 L136 230 Z"/>`},
  paint(){return `<path d="${blob(95,100,70,.5,7)}" fill="#111" fill-opacity=".08"/><path d="${blob(95,100,70,.5,7)}"/><path d="${blob(160,150,52,.6,21)}" fill="#111" fill-opacity=".14" stroke="none"/>
    <path d="M10 200 C70 160 130 236 230 176" stroke-width="7" stroke-linecap="round"/><path d="M30 40 C60 20 92 54 128 32" stroke-width="3" stroke-linecap="round"/><circle cx="190" cy="60" r="20" fill="#111"/>`},
  sketch(){let s="";const o=[[110,226],[90,196],[84,156],[98,124],[108,100],[106,70],[132,70],[130,100],[140,124],[154,156],[148,196],[128,226]];
    for(let k=0;k<3;k++)s+=`<path d="${jline(o.concat([o[0]]),11+k,4)}" stroke-width=".6"/>`;
    for(let i=0;i<16;i++){const y=130+i*5;s+=`<path d="${jline([[112,y],[142,y-10]],40+i,1.6)}" stroke-width=".4"/>`}
    for(let i=0;i<30;i++){const x=i*8;s+=`<path d="${jline([[x,232],[x+14,214]],90+i,1.2)}" stroke-width=".3"/>`}
    return s+`<path d="${jline([[0,232],[240,232]],3,2)}"/><path d="${jline([[170,232],[200,180],[228,232]],5,3)}" stroke-width=".7"/>`}
};
function svgArt(kind){return `<svg viewBox="0 0 240 240" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#111" stroke-width=".55" stroke-linejoin="round" aria-hidden="true">${ART[kind]()}</svg>`}

/* entourage: sketched tree and scale figure */
function tree(){const R=rng(12);let s=`<path d="M52 181 C51 160 50 140 47 118 M55 181 C56 160 57 138 60 116 M50 150 L36 132 M57 140 L74 124" stroke="#222" stroke-width=".8" fill="none"/>`;
  for(let i=0;i<46;i++){const cx=30+R()*50,cy=18+R()*92;const r=6+R()*9;let d=`M${f(cx)} ${f(cy)}`;for(let k=0;k<7;k++){d+=` l${f((R()-.5)*r)} ${f((R()-.5)*r)}`}s+=`<path d="${d}" stroke="#222" stroke-width="${f(.35+R()*.5)}" fill="none"/>`}
  for(let i=0;i<40;i++){const a=R()*Math.PI*2,rr=40+R()*14;const cx=55+Math.cos(a)*rr*.75,cy=62+Math.sin(a)*rr;s+=`<path d="M${f(cx)} ${f(cy)} q${f((R()-.5)*8)} ${f(-4-R()*4)} ${f((R()-.5)*10)} ${f((R()-.5)*6)}" stroke="#333" stroke-width=".45" fill="none"/>`}
  return `<svg viewBox="0 0 110 181">${s}</svg>`}
function figure(){return `<svg viewBox="0 0 24 50"><circle cx="12" cy="5" r="4" fill="#3A3A40"/><path d="M5 12 Q12 9 19 12 L20 30 L17 30 L16 49 L13 49 L12 33 L11 49 L8 49 L7 30 L4 30 Z" fill="#3A3A40"/></svg>`}


/* ---------- hello section, filled from content.js ---------- */
function bars(t){return esc(t).replace(/\s*\|\s*/g," &nbsp;|&nbsp; ")}
function buildHero(){
  const items=list=>list.map(x=>`<p class="fi"><b>${esc(x.title)}</b><small>${bars(x.detail)}</small></p>`).join("");
  const dots=n=>`<span class="dots" aria-label="${n} of 3">`+[0,1,2].map(k=>k<n?"<i></i>":'<i class="o"></i>').join("")+"</span>";
  document.getElementById("facts").innerHTML=
    `<section class="fsec"><h2>Info</h2><div>${items(SITE.info)}</div></section>`+
    `<section class="fsec"><h2>Education</h2><div>${items(SITE.education)}</div></section>`+
    `<section class="fsec certs"><h2>Certifications</h2><div>${items(SITE.certifications)}</div></section>`+
    `<section class="fsec skills"><h2>Skills</h2><div class="sk">${SITE.skills.map(([n,l])=>`<span>${dots(l)}${esc(n)}</span>`).join("")}</div></section>`;
  document.getElementById("strip").innerHTML=`<span>${esc(SITE.email)}</span><span>${esc(SITE.phone)}</span><span>${esc(SITE.city)}</span>`;
  for(const id of ["hello-name","foot-name"])document.getElementById(id).textContent=SITE.name;
  document.getElementById("bar-name").textContent=SITE.name.toUpperCase();
  document.getElementById("foot-year").textContent=new Date().getFullYear();
}

/* ---------- recycled cardstock texture (generated once, tiled) ---------- */
(function paper(){
  try{
    const S=640,c=document.createElement("canvas");c.width=c.height=S;const g=c.getContext("2d");const R=rng(77);
    const wrap=(fn)=>{for(const dx of [-S,0,S])for(const dy of [-S,0,S])fn(dx,dy)};
    // soft mottling, like pulp settling unevenly
    for(let i=0;i<46;i++){const x=R()*S,y=R()*S,r=40+R()*130,a=.018+R()*.03,warm=R()<.6;
      wrap((dx,dy)=>{const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);gr.addColorStop(0,warm?`rgba(150,128,80,${a})`:`rgba(255,255,250,${a*2.2})`);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(x+dx-r,y+dy-r,r*2,r*2)})}
    // fibres
    const fib=(n,col,amin,amax,wmin,wmax,lmin,lmax)=>{for(let i=0;i<n;i++){const x=R()*S,y=R()*S,l=lmin+R()*(lmax-lmin),t=R()*Math.PI*2,bend=(R()-.5)*l*.8,a=amin+R()*(amax-amin),w=wmin+R()*(wmax-wmin);
      const x2=x+Math.cos(t)*l,y2=y+Math.sin(t)*l,mx=(x+x2)/2+Math.cos(t+Math.PI/2)*bend,my=(y+y2)/2+Math.sin(t+Math.PI/2)*bend;
      wrap((dx,dy)=>{g.beginPath();g.moveTo(x+dx,y+dy);g.quadraticCurveTo(mx+dx,my+dy,x2+dx,y2+dy);g.strokeStyle=`rgba(${col},${a})`;g.lineWidth=w;g.stroke()})}};
    fib(1500,"118,100,72",.05,.16,.35,.8,3,14);
    fib(500,"255,255,248",.35,.7,.5,1.1,4,16);
    fib(70,"95,108,124",.12,.26,.4,.8,6,22);
    // flecks: grey ink, brown pulp, the odd coloured scrap
    const cols=["70,64,56","120,92,58","92,104,120","150,120,90","168,96,80","96,118,96"];
    for(let i=0;i<560;i++){const x=R()*S,y=R()*S,r=.35+Math.pow(R(),3)*2.1,k=R(),col=k<.55?cols[0]:k<.8?cols[1]:k<.92?cols[2]:cols[3+Math.floor(R()*3)],a=.18+R()*.45;
      wrap((dx,dy)=>{g.beginPath();g.ellipse(x+dx,y+dy,r,r*(.5+R()*.6),R()*3,0,Math.PI*2);g.fillStyle=`rgba(${col},${a})`;g.fill()})}
    // fine tooth
    const im=g.getImageData(0,0,S,S),d=im.data;
    for(let i=0;i<d.length;i+=4){const n=R();if(n<.5){const a=n*26;d[i]=(d[i]*d[i+3]+90*a)/(d[i+3]+a||1);d[i+1]=(d[i+1]*d[i+3]+80*a)/(d[i+3]+a||1);d[i+2]=(d[i+2]*d[i+3]+60*a)/(d[i+3]+a||1);d[i+3]=Math.min(255,d[i+3]+a)}}
    g.putImageData(im,0,0);
    document.documentElement.style.setProperty("--tex",`url(${c.toDataURL("image/png")})`);
  }catch(e){}
})();

/* ---------- index artboard (1630 units wide) ---------- */
const U=n=>`calc(var(--u)*${n})`;
const at=(x,y,w,h)=>`left:${U(x)};top:${U(y)};${w!=null?`width:${U(w)};`:""}${h!=null?`height:${U(h)};`:""}`;
function buildIndex(){
  const C={A:136,B:213,Cc:435,D:656,E:932,F:1153,G:1375,G2:1383,end:1630},RW=221;
  let h="";
  const vl=(x,y1,y2)=>h+=`<i class="vl" style="${at(x,y1,null,y2-y1)}"></i>`;
  const hl=(x1,x2,y)=>h+=`<i class="hl" style="${at(x1,y,x2-x1,null)}"></i>`;
  const bar=(x,y)=>h+=`<i class="bk" style="${at(x,y,8,RW)}"></i>`;
  const R0=143,L0=363,LEND=L0+4*RW,REND=R0+4*RW;
  // ghost title + entourage tree
  h+=`<p class="ghost" aria-hidden="true" style="${at(132,72)}">INDEX</p>`;
  h+=`<div class="deco" aria-hidden="true" style="${at(600,R0+40,112,181)}">${tree()}</div>`;
  // grid lines
  vl(C.D,32,LEND+111);
  [C.E,C.F,C.G,C.G2].forEach(x=>vl(x,32,REND));
  [C.A,C.Cc].forEach(x=>vl(x,L0,LEND+111));
  hl(C.D,C.end,R0);
  for(let y=L0;y<=REND;y+=RW)hl(C.A,C.end,y);
  hl(C.A,C.D,LEND);
  // left column: projects 1-4
  const left=PROJECTS.slice(0,4),right=PROJECTS.slice(4);
  const item=(p,n,x,y,imgFirst,narrow)=>{
    const img=`<div class="img ${narrow?"narrow":""}">${svgArt(p.art)}</div>`;
    const txt=`<div class="txt"><h3>${esc(p.title)}</h3><p>${esc(p.sub)}</p><span class="pg">${p.code} &nbsp;${esc(CATS[p.cat])}</span><span class="go">Open &rarr;</span></div>`;
    h+=`<a class="item" href="#${p.id}" style="${at(x,y,442,RW)}" aria-label="${n}. ${esc(p.title)}">${imgFirst?img+txt:txt+img}</a>`;
  };
  left.forEach((p,i)=>{const y=L0+i*RW,n=i+1;
    h+=`<span class="num" style="${at(C.A+15,y+12)}">${n}</span>`;
    if(i%2===0){bar(C.B-8,y);item(p,n,C.B,y,true,false)}else{vl(C.B,y,y+RW);item(p,n,C.B,y,false,false)}
  });
  // right column: projects 5-8, one row higher
  right.forEach((p,i)=>{const y=R0+i*RW,n=i+5;
    h+=`<span class="num r" style="${at(C.E-120,y+12,74,null)}">${n}</span>`;
    if(i===0){item(p,n,C.E,y,true,false);bar(C.G,y)}
    else if(i===2){bar(C.E-7,y);item(p,n,C.E,y,true,true);h+=`<div class="deco" aria-hidden="true" style="${at(C.E+12,y+RW-46,22,46)}">${figure()}</div>`}
    else item(p,n,C.E,y,false,false);
  });
  document.getElementById("canvas").innerHTML=h;
  // phone list
  document.getElementById("mlist").innerHTML=`<p class="mghost" aria-hidden="true">INDEX</p>`+PROJECTS.map((p,i)=>`<a class="mitem" href="#${p.id}"><span class="n">${i+1}</span><div class="img">${svgArt(p.art)}</div><div class="t"><h3>${esc(p.title)}</h3><p>${esc(p.sub)}</p><p>${p.code}</p></div></a>`).join("")+`<div class="last"></div>`;
  document.getElementById("tblock").innerHTML=CONTACT.map(([k,v,c])=>`<div class="${c}"><span class="k mono">${k}</span><span class="v">${v.startsWith("https://")?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https:\/\/(www\.)?/,"").replace(/\/$/,""))}</a>`:esc(v)}</span></div>`).join("");
}

/* ---------- project pages ---------- */
const TEMPLATES={
  case:[["Result","One headline with a number. For example: opened on the target date, within 3% of budget."],["Challenge","Two or three sentences on what made this project hard."],["What I did","Three or four decisions, each with a short caption and a graphic.","tall"],["Construction evidence","Timeline, procurement log, budget tracker or marked-up drawing.","tall"],["Outcome","Final numbers, plus a client quote and one finished photo.","tall"],["Tools used","For example: schedule rebuilt in MS Project, markups in Bluebeam."]],
  cpm:[["Overview","Which project this package is built from, its scope, and what each deliverable shows."],["Quantity takeoff","Bluebeam markups and the exported quantities table.","tall"],["Cost estimate","Estimate by CSI division, with general conditions, overhead and profit, and contingency.","tall"],["Bid leveling","Three subcontractor bids compared side by side."],["Value engineering","One swap with its cost and lead-time savings."],["CPM schedule","Gantt with logic ties, long-lead procurement and the critical path highlighted.","tall"],["Logs","Procurement and submittal log, a sample RFI and a change order."],["Risk and site logistics","Risk register and a simple site logistics plan."]],
  ux:[["Problem","Who the users are and what was getting in their way."],["Process","Research, flows and wireframes.","tall"],["Screens","Final screens with short captions.","tall"],["Outcome","What changed, with numbers if you have them."]]
};
const SNAP={case:["Type","Size","Budget","Duration","Role","Team"],cpm:["Based on","Size","Estimate","Schedule","Tools","Status"],ux:["Type","Platform","Duration","Role","Tools","Year"]};
function renderProject(p){
  const i=PROJECTS.indexOf(p),prev=PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length],next=PROJECTS[(i+1)%PROJECTS.length];
  const body=p.tpl==="gallery"
    ?`<div class="gallery">${[1,2,3,4,5,6].map(n=>`<div class="frame mono">Image ${n}</div>`).join("")}</div><div class="secs"><section class="sec"><h2><i>01</i>About this work</h2><div class="slot">Medium, size, and what you were exploring.</div></section></div>`
    :`<dl class="snap">${SNAP[p.tpl].map(k=>`<div><dt class="mono">${k}</dt><dd>To come</dd></div>`).join("")}</dl><div class="secs">${TEMPLATES[p.tpl].map(([hd,note,cls],n)=>`<section class="sec"><h2><i>${String(n+1).padStart(2,"0")}</i>${hd}</h2><div class="slot ${cls||""}">${esc(note)}</div></section>`).join("")}</div>`;
  document.getElementById("project").innerHTML=`<a class="back mono" href="#work">&larr; Back to index</a>
    <header class="p-head"><div><span class="mono p-meta">${i+1} &nbsp;&middot;&nbsp; ${p.code} &nbsp;&middot;&nbsp; ${esc(CATS[p.cat])}</span><h1>${esc(p.title)}</h1><p class="p-sub">${esc(p.sub)}</p><p class="draft mono">Draft page. Case study content coming soon.</p></div>
    <figure class="p-cover">${svgArt(p.art)}</figure></header>${body}
    <nav class="pn"><a href="#${prev.id}"><span class="mono">&larr; ${prev.code}</span><b>${esc(prev.title)}</b></a><a href="#${next.id}"><span class="mono">${next.code} &rarr;</span><b>${esc(next.title)}</b></a></nav>`;
}

/* ---------- routing ---------- */
function route(){
  const id=decodeURIComponent(location.hash.slice(1));const p=PROJECTS.find(x=>x.id===id);
  const home=document.getElementById("home"),proj=document.getElementById("project");
  if(p){home.hidden=true;proj.hidden=false;renderProject(p);window.scrollTo(0,0);document.title=p.title+" · "+SITE.name;return}
  proj.hidden=true;home.hidden=false;document.title=SITE.name+" \u00b7 Portfolio";
  const t=id&&document.getElementById(id);if(t)requestAnimationFrame(()=>t.scrollIntoView());
}
buildHero();buildIndex();route();
window.addEventListener("hashchange",route);
</script>
